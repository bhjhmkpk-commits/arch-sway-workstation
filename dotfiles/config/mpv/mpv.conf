# ==============================================================================
# 🎬 High-Performance MPV Configuration - Intel HD 530 + Wayland
# Zero-copy VA-API hardware video decode (<2% CPU), Everforest OSD
# ==============================================================================

# Native Wayland & Hardware Acceleration
gpu-context=wayland
vo=gpu
hwdec=vaapi

# Audio & Language
audio-file-auto=fuzzy
sub-auto=fuzzy
alang=eng,en,hin,hi,ja,jp
slang=eng,en

# On-Screen Display (OSD) - Eye-friendly Everforest Theme
osd-font="JetBrainsMono Nerd Font"
osd-font-size=26
osd-color="#e6e2d8"
osd-border-color="#1e2a24"
osd-border-size=2
osd-bar-h=3
osd-bar-w=60

# Screenshot directory
screenshot-directory=~/
screenshot-template="video-screenshot-%F-%P"
screenshot-format=png
