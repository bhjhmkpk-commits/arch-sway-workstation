# ==============================================================================
# 🎮 MPV Intuitive Keybindings (Audio Track & Playback)
# ==============================================================================

# Audio Track Switching:
# Press 'a' to cycle audio tracks forward (with on-screen name & language)
# Press 'Shift+a' to cycle audio tracks backward
a cycle audio
A cycle audio down
# cycle audio

# Subtitle Track Switching:
s cycle sub
S cycle sub down

# Volume & Seeking:
UP add volume 5
DOWN add volume -5
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
RIGHT seek 5
LEFT seek -5
